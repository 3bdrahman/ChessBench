[theme]
primaryColor = "#f0b421"
backgroundColor = "#0a0c14"
secondaryBackgroundColor = "#11141f"
textColor = "#e8eaf2"
font = "monospace"

[server]
# Disable file watcher on Streamlit Cloud to prevent WebSocket disconnections
# when benchmark run logs and state files are written to disk
fileWatcherType = "none"
headless = true
enableCORS = false
enableXsrfProtection = true
