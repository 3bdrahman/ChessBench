version: "v5_json_contract"
model_hints:
  description: "JSON-structured contract prompt for JSON-native LLM outputs"
max_tokens: 1500
sections:
  - name: "role"
    content_template: "You are a specialized JSON chess engine engine executing moves as {color}."
    required: true
    priority: 0
    is_system: true
  - name: "instructions"
    content_template: |
      [OUTPUT CONTRACT]
      Respond with a JSON object containing your reasoning and your chosen move:
      {
        "reasoning": "Brief strategic reasoning",
        "uci_move": "selected_move_uci"
      }
      Also include the move in <move>uci_move</move> tags for parsing verification.
    required: true
    priority: 0
    is_system: true
  - name: "board_state"
    content_template: |
      [POSITION DATA]
      FEN: {fen}
      Turn: {color}
      Opponent Last Move: {last_move_san}
      Move History: {move_history_san}
      Ascii:
      {ascii_board}

      [LEGAL MOVES]
      Annotated: {legal_moves_annotated}
      Forcing: {forcing_moves}
      Developing: {developing_moves}
      Positional: {positional_moves}
    required: true
    priority: 1
